# Un servicio sirve React y FastAPI; SQLite permanece en el disco adjunto.
services:
  - type: web
    name: lekil-kuxlejal
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn app.hosted:create_hosted_app --factory --app-dir backend --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: 'commit'
    disk:
      name: lekil-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        value: sqlite:////var/data/lekil.db
      - key: LEKIL_DATA_DIR
        value: /var/data
      - key: LEKIL_WEB_USER
        sync: false
      - key: LEKIL_WEB_PASSWORD
        sync: false
